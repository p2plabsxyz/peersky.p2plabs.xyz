<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--MetaTags-->
  <meta name="author" content="Akhilesh Thite" />
  <meta name="description" content="PeerSky for iPhone and Android: browse the web, chat, share files and write notes straight between devices, even offline." />
  <meta property="og:title" content="PeerSky Mobile" />
  <meta property="og:description" content="Peer to peer in your pocket. Browse the web, chat, share files and write notes straight between devices, even offline." />
  <meta property="og:url" content="https://peersky.p2plabs.xyz/mobile/" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://peersky.p2plabs.xyz/images/link-card.png" />
  <meta property="og:image:width" content="1024" />
  <meta property="og:image:height" content="500" />
  <meta property="og:image:alt" content="PeerSky: your peer-to-peer, local-first, surveillance-free browser" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PeerSky Mobile" />
  <meta name="twitter:description" content="Peer to peer in your pocket. Browse the web, chat, share files and write notes straight between devices, even offline." />
  <meta name="twitter:image" content="https://peersky.p2plabs.xyz/images/link-card.png" />
  <!--Favicon-->
  <link rel="shortcut icon" type="image/png" href="../images/favicon.ico" />
  <!-- Tailwind (vendored) -->
  <script>
    // The theme goes on before anything is drawn: light, unless dark was picked here before.
    (function () { var t = null; try { t = localStorage.getItem('theme') } catch (e) {} document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light' })()
  </script>
  <link href="../lib/tailwind.min.css" rel="stylesheet" />
  <link href="../site.css" rel="stylesheet" />
  <title>PeerSky Mobile</title>
</head>

<body>
  <div class="logo-field" aria-hidden="true"></div>

  <header>
    <div class="max-w-3xl mx-auto px-5 sm:px-10 md:px-20">
      <nav class="page-nav" aria-label="Site">
        <a class="back-link" href="../">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
          Back to PeerSky
        </a>
        <theme-toggle></theme-toggle>
      </nav>
      <div class="mt-6 text-center">
        <h1><code class="text-3xl sm:text-4xl">PeerSky Mobile</code></h1>
        <p class="mt-2">Peer to peer in your pocket.</p>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-5 sm:px-10 md:px-20">
    <section id="ios" class="platform-card" aria-labelledby="ios-title">
      <h2 id="ios-title" class="text-2xl font-bold">iOS</h2>
      <!-- TODO: put the App Store link here, and drop data-coming-soon -->
      <a class="store-badge mt-4" href="#todo-app-store" target="_blank" rel="noopener noreferrer" data-coming-soon>
        <img src="../images/app-store-badge.svg" width="120" height="40" alt="Download on the App Store" />
      </a>
    </section>

    <section id="android" class="platform-card" aria-labelledby="android-title">
      <h2 id="android-title" class="text-2xl font-bold">Android</h2>
      <div class="store-badges">
        <a class="store-badge" href="https://play.google.com/store/apps/details?id=xyz.p2plabs.peersky" target="_blank" rel="noopener noreferrer">
          <img src="../images/google-play-badge.svg" width="239" height="71" alt="Get it on Google Play" />
        </a>
        <a class="store-badge" href="https://github.com/p2plabsxyz/peersky-mobile/releases/latest" target="_blank" rel="noopener noreferrer">
          <img src="../images/apk.png" width="544" height="182" alt="Download the APK for Android" />
        </a>
      </div>
    </section>

    <section class="mt-8 text-gray-700">
      <h2 class="text-xl font-bold text-gray-900">Found something broken?</h2>
      <p class="mt-2">
        Tell us in a <a href="https://github.com/p2plabsxyz/peersky-mobile/issues" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:text-blue-500">GitHub issue</a>,
        on <a href="https://matrix.to/#/#peersky:matrix.org" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:text-blue-500">Matrix</a>, or in
        <a href="https://republic.p2plabs.xyz/" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:text-blue-500">PeerChat</a>.
      </p>
    </section>

    <peersky-footer></peersky-footer>
  </main>

  <script src="../components/logo-field.js"></script>
  <script src="../components/footer.js"></script>
  <script src="../coming-soon.js"></script>
  <script src="../components/theme-toggle.js"></script>
</body>

</html>
