<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--MetaTags-->
  <meta name="author" content="Akhilesh Thite" />
  <meta name="description" content="Install PeerSky on your phone: browse the web, chat, share files and write notes straight between devices, even offline." />
  <meta property="og:title" content="Install PeerSky" />
  <meta property="og:description" content="Peer to peer in your pocket. Browse the web, chat, share files and write notes straight between devices, even offline." />
  <meta property="og:url" content="https://peersky.p2plabs.xyz/install/" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://peersky.p2plabs.xyz/images/link-card.png" />
  <meta property="og:image:width" content="1024" />
  <meta property="og:image:height" content="500" />
  <meta property="og:image:alt" content="PeerSky: your peer-to-peer, local-first, surveillance-free browser" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Install PeerSky" />
  <meta name="twitter:description" content="Peer to peer in your pocket. Browse the web, chat, share files and write notes straight between devices, even offline." />
  <meta name="twitter:image" content="https://peersky.p2plabs.xyz/images/link-card.png" />
  <!--Favicon-->
  <link rel="shortcut icon" type="image/png" href="../images/favicon.ico" />
  <script>
    // A phone goes straight to its store, a computer to the downloads on the
    // home page. An iPhone stays here until the App Store link is in.
    (function () {
      var googlePlay = 'https://play.google.com/store/apps/details?id=xyz.p2plabs.peersky'
      // TODO: the App Store link, once Apple approves PeerSky
      var appStore = '#todo-app-store'
      var ua = navigator.userAgent
      // An iPad asks for desktop sites as a Mac, but it has a touch screen.
      var iOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)
      if (/Android/.test(ua)) location.replace(googlePlay)
      else if (!iOS) location.replace('../#downloads')
      else if (appStore.indexOf('https://') === 0) location.replace(appStore)
    })()
  </script>
  <!-- Tailwind (vendored) -->
  <script>
    // The theme goes on before anything is drawn: light, unless dark was picked here before.
    (function () { var t = null; try { t = localStorage.getItem('theme') } catch (e) {} document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light' })()
  </script>
  <link href="../lib/tailwind.min.css" rel="stylesheet" />
  <link href="../site.css" rel="stylesheet" />
  <title>Install PeerSky</title>
</head>

<body class="install-page">
  <div class="logo-field" aria-hidden="true"></div>

  <div class="max-w-3xl mx-auto px-5 sm:px-10 md:px-20">
    <nav class="page-nav" aria-label="Site">
      <a class="back-link" href="../">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
        Back to PeerSky
      </a>
      <theme-toggle></theme-toggle>
    </nav>

    <header class="install-header">
      <img class="install-logo" src="../images/logo.png" width="480" height="480" alt="PeerSky logo" />
      <h1><code class="text-3xl sm:text-4xl">Install PeerSky</code></h1>
      <p class="mt-2">Peer to peer in your pocket.</p>
    </header>

    <main>
      <!-- What an iPhone shows until the App Store link is in. -->
      <section id="ios" class="platform-card" aria-labelledby="ios-title">
        <h2 id="ios-title" class="text-2xl font-bold">iOS</h2>
        <p class="mt-2 text-gray-700">
          PeerSky for iOS will be out soon. We'll announce it then, and it will show up here too.
        </p>
      </section>

      <!-- Without scripts nothing sends a phone or a computer on, so it gets links. -->
      <noscript>
        <section class="platform-card text-gray-700">
          On Android, get PeerSky on
          <a href="https://play.google.com/store/apps/details?id=xyz.p2plabs.peersky" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:text-blue-500">Google Play</a>.
          On a computer, <a href="../#downloads" class="text-blue-600 hover:text-blue-500">download PeerSky for desktop</a>.
        </section>
      </noscript>

      <peersky-footer></peersky-footer>
    </main>
  </div>

  <script src="../components/logo-field.js"></script>
  <script src="../components/footer.js"></script>
  <script src="../components/theme-toggle.js"></script>
</body>

</html>
